services:
  # 1. TRAEFIK - обратный прокси с автополучением SSL
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    command:
      # Включает встроенный веб-интерфейс/API
      # Позволяет просматривать конфигурацию и статистику
      # После активации будет доступен по адресу: http://localhost:8080 (нужно также раскомментировать проброс порта разделе ports)
      # - "--api=true"
      # Разрешить НЕбезопасный доступ к API (без аутентификации)
      # ⚠️ ОПАСНО: оставлять только для локальной разработки
      # Если раскомментировать, API будет доступен всем без пароля
      # - "--api.insecure=true"
      # Включает Docker провайдер для автоматического обнаружения контейнеров
      # Traefik автоматически найдет контейнеры с метками - "traefik.enable=true"
      - "--providers.docker=true"
      # Отвечает за автоматическое включение/выключение обработки контейнеров
      # Traefik будет обрабатывать только контейнеры с меткой - "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Определяет точку входа для HTTP запросов на порту 80
      # Traefik будет слушать HTTP-запросы на стандартном порту 80
      - "--entrypoints.web.address=:80"
      # Настраивает перенаправление всех HTTP запросов на HTTPS
      # Все запросы к порту 80 будут автоматически перенаправлены на порт 443
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      # Указывает схему перенаправления HTTP → HTTPS
      # Изменяет протокол с http на https при автоматическом редиректе
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Устанавливает постоянный редирект (код 301)
      # Браузеры запоминают этот редирект и в следующий раз сразу идут на HTTPS-версию
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # Определяет точку входа для HTTPS запросов на порту 443
      # Traefik будет слушать HTTPS-запросы на стандартном порту 443
      - "--entrypoints.websecure.address=:443"
      # Включает TLS Challenge для получения SSL сертификатов от Let's Encrypt
      # Автоматическое получение и обновление SSL сертификатов (работает через порт 443)
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      # Устанавливает email для регистрации аккаунта Let's Encrypt
      # Обязательный параметр для создания аккаунта и получения SSL сертификатов
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      # Задаёт путь для хранения ACME данных и SSL сертификатов
      # В этом файле будут храниться учетные данные Let's Encrypt и полученные сертификаты
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
      # Настраивает уровень детализации логов Traefik
      # DEBUG: максимальная детализация (для отладки проблем)
      # INFO: нормальный уровень для production (рекомендуется)
      # WARN/ERROR: только предупреждения и ошибки
      # - "--log.level=INFO"
      # Включает логирование всех входящих HTTP запросов (access logs)
      # Плюсы: позволяет видеть кто, когда и что запрашивал
      # Минусы: увеличивает объем логов и может содержать чувствительные данные
      # - "--accesslog=true"
    ports:
      - "80:80"                      # Проброс HTTP порта для входящих запросов
      - "443:443"                    # Проброс HTTPS порта для защищённых соединений
    #  - "127.0.0.1:8080:8080"       # Проброс порта веб-интерфейса Traefik (только локально, для доступа к дашборду)
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik_public
      - internal_network

  # 2. OLLAMA - локальная AI модель
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=3
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MMAP=1
      - OLLAMA_MLOCK=0
    networks:
      - internal_network
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '3.0'
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 3. OPEN-WEBUI - веб-интерфейс для Ollama
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-changeme}
    volumes:
      - open-webui_data:/app/backend/data
    networks:
      - internal_network
      - traefik_public
    labels:
      # Отвечает за включение обработки контейнера Traefik
      # Без этой метки Traefik будет игнорировать контейнер, даже если он слушает порты
      - "traefik.enable=true"
      # Определяет правило маршрутизации по домену
      # Все запросы на указанный поддомен.${DOMAIN} будут направлены в этот контейнер
      - "traefik.http.routers.open-webui.rule=Host(`ollama.${DOMAIN}`)"
      # Указывает точку входа для маршрутизации - HTTPS порт 443
      # Трафик принимается только через защищённое HTTPS соединение
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      # Включает обязательное использование SSL/TLS шифрования
      # Все соединения к этому роутеру должны использовать HTTPS
      - "traefik.http.routers.open-webui.tls=true"
      # Задаёт резолвер для автоматического получения SSL сертификатов
      # Используем Let's Encrypt с TLS Challenge (настроено в command как mytlschallenge)
      - "traefik.http.routers.open-webui.tls.certresolver=mytlschallenge"
      # Устанавливает HSTS заголовок сроком на 1 год
      # Заставляет браузеры всегда использовать HTTPS для этого домена в течение указанного времени
      - "traefik.http.middlewares.open-webui-security.headers.STSSeconds=31536000"
      # Расширяет действие HSTS на все поддомены текущего домена
      - "traefik.http.middlewares.open-webui-security.headers.STSIncludeSubdomains=true"
      # Включает защиту от межсайтового скриптинга (XSS)
      # Активирует встроенную защиту XSS в современных браузерах
      - "traefik.http.middlewares.open-webui-security.headers.browserXSSFilter=true"
      # Запрещает MIME-sniffing тип контента
      # Браузер не будет пытаться угадывать тип контента, используя только Content-Type заголовок
      - "traefik.http.middlewares.open-webui-security.headers.contentTypeNosniff=true"
      # Устанавливает защиту от кликджекинга через iframe
      # Разрешает встраивание только с того же источника (SAMEORIGIN)
      - "traefik.http.middlewares.open-webui-security.headers.customFrameOptionsValue=SAMEORIGIN"
      # Применяет security headers к указанному роутеру
      # Middleware open-webui-security будет обрабатывать все запросы к этому роутеру
      - "traefik.http.routers.open-webui.middlewares=open-webui-security@docker"
      # Указывает внутренний порт контейнера
      # Traefik будет направлять трафик на указанный порт
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
      # Определяет протокол соединения между Traefik и контейнером внутри сети
      # Используется HTTP (без шифрования) так как трафик внутри защищённой Docker сети
      - "traefik.http.services.open-webui.loadbalancer.server.scheme=http"

  # 4. POSTGRES - база данных
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. REDIS - кэш и очередь сообщений
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 6. N8N - платформа автоматизации
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Samara}

      # База данных
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DB_POSTGRESDB_SSL: "false"

      # Веб-настройки
      N8N_PROTOCOL: https
      N8N_HOST: n8n.${DOMAIN}
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_PORT: 5678

      # Безопасность
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Ollama
      OLLAMA_API_URL: http://ollama:11434

      # Производительность
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BULL_MQ_REDIS_HOST: redis
      N8N_BULL_MQ_REDIS_PORT: 6379
      EXTERNAL_FRONTEND_HOOKS_URLS: "https://n8n.${DOMAIN}"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - traefik_public
      - internal_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=mytlschallenge"
      - "traefik.http.middlewares.n8n-security.headers.STSSeconds=31536000"
      - "traefik.http.middlewares.n8n-security.headers.STSIncludeSubdomains=true"
      - "traefik.http.middlewares.n8n-security.headers.browserXSSFilter=true"
      - "traefik.http.middlewares.n8n-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.n8n-security.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.routers.n8n.middlewares=n8n-security@docker"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.http.services.n8n.loadbalancer.server.scheme=http"

networks:
  internal_network:
    internal: true
  traefik_public:

volumes:
  postgres_data:
  ollama_data:
  open-webui_data:
  redis_data:
  traefik_data:
  n8n_data: